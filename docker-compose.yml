services:
  minecraft-panel:
    build:
      context: .
      dockerfile: docker/panel.Dockerfile
    container_name: minecraft-panel
    restart: unless-stopped
    environment:
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:?Copy .env.example to .env and set PANEL_ADMIN_PASSWORD}
      PANEL_HOST: 0.0.0.0
      MINECRAFT_RCON_PASSWORD: ${MINECRAFT_RCON_PASSWORD:?Copy .env.example to .env and set MINECRAFT_RCON_PASSWORD}
      MINECRAFT_RCON_PORT: 25575
      MINECRAFT_DIR: /app/server
      LOG_FILE: /app/server/logs/latest.log
      DATA_FILE: /panel-data/.panel-users.json
      PUBLIC_DIR: /app/dist
    ports:
      - "8787:8787"
      - "25565:25565"
    volumes:
      - ./server:/app/server
      - ./scripts:/app/scripts:ro
      - panel-data:/panel-data
    mem_limit: 3g
    cpus: 2.0

volumes:
  panel-data:
